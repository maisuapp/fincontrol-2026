    /**
     * OTIMIZAÇÃO CRÍTICA PARA IPHONE 14 & PIXEL 7:
     * Redimensiona e comprime a foto via HTML5 Canvas
     * Converte fotos HEIC/HEIF de iPhone para JPEG padrão leve (~150KB)
     */
    function compressImageForAI(file, maxDim = 1200, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > h) {
              if (w > maxDim) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              }
            } else {
              if (h > maxDim) {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const jpegDataUrl = canvas.toDataURL('image/jpeg', quality);
            const base64 = jpegDataUrl.split(',')[1];
            resolve(base64);
          };
          img.onerror = () => reject(new Error('Erro ao processar imagem no aparelho.'));
        };
        reader.onerror = () => reject(new Error('Erro ao ler foto da câmera.'));
      });
    }

    function App() {
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [transactions, setTransactions] = useState(() => {
        try {
          const local = localStorage.getItem('fc26_transactions');
          return local ? JSON.parse(local) : DADOS_INICIAIS;
        } catch(e) {
          return DADOS_INICIAIS;
        }
      });
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingTransaction, setEditingTransaction] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [geminiApiKey, setGeminiApiKey] = useState(localStorage.getItem('fc26_gemini_api_key') || '');
      const [isScanning, setIsScanning] = useState(false);
      const [statusScanningText, setStatusScanningText] = useState('Processando...');
      const [isTestingKey, setIsTestingKey] = useState(false);
      const fileInputRef = useRef(null);

      const showToast = (msg, isError = false) => {
        setToastMessage({ msg, isError });
        setTimeout(() => setToastMessage(null), 4000);
      };

      const handleSave = async (txData) => {
        let updatedList;
        if (editingTransaction && editingTransaction.id) {
          updatedList = transactions.map(t => t.id === editingTransaction.id ? { ...txData, id: t.id } : t);
          showToast('Lançamento atualizado com sucesso!');
        } else {
          const newTx = { ...txData, id: 'tx-' + Date.now() };
          updatedList = [newTx, ...transactions];
          showToast('Lançamento registrado com sucesso!');
        }
        setTransactions(updatedList);
        try {
          localStorage.setItem('fc26_transactions', JSON.stringify(updatedList));
        } catch(e){}

        const token = localStorage.getItem('gdrive_access_token');
        if (token && (!editingTransaction || !editingTransaction.id)) {
          try {
            const range = `${SHEET_NAME}!A2:G`;
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`;
            await fetch(url, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                values: [[txData.data, '', txData.tipo, txData.categoria, txData.valor, txData.estabelecimento, txData.observacoes || '']]
              })
            });
            showToast('Lançamento salvo na Planilha Google!');
          } catch (e) {
            console.error(e);
          }
        }
      };

      const handleDelete = (idToDelete) => {
        if (!confirm('Deseja realmente excluir este lançamento?')) return;
        const updatedList = transactions.filter(t => t.id !== idToDelete);
        setTransactions(updatedList);
        try {
          localStorage.setItem('fc26_transactions', JSON.stringify(updatedList));
        } catch(e){}
        setIsModalOpen(false);
        setEditingTransaction(null);
        showToast('Lançamento excluído.');
      };

      const handleOpenCreate = () => {
        setEditingTransaction(null);
        setIsModalOpen(true);
      };

      const handleOpenEdit = (tx) => {
        setEditingTransaction(tx);
        setIsModalOpen(true);
      };

      // Teste de conexão da chave Gemini com modelos atuais
      const handleTestApiKey = async () => {
        const key = geminiApiKey.trim();
        if (!key) {
          showToast('Cole a chave da API primeiro.', true);
          return;
        }
        setIsTestingKey(true);
        try {
          const modelsToTest = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-flash-latest'];
          let ok = false;
          let lastErr = '';
          for (const m of modelsToTest) {
            try {
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: 'Responda apenas: OK' }] }]
                })
              });
              if (res.ok) { ok = true; break; }
              const errData = await res.json().catch(() => ({}));
              lastErr = errData.error?.message || `Erro ${res.status}`;
            } catch(e) { lastErr = e.message; }
          }
          if (!ok) throw new Error(lastErr || 'Chave inválida ou recusada.');
          showToast('✓ Chave Gemini testada e funcionando perfeitamente!');
        } catch(err) {
          showToast('Erro na chave: ' + err.message, true);
        } finally {
          setIsTestingKey(false);
        }
      };

      // Captura Inteligente via Câmera com compressão e parsing robusto
      const handleCapture = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const key = geminiApiKey.trim();
        if (!key) {
          showToast('Por favor, configure a chave Gemini na aba Conexão.', true);
          setCurrentTab('config');
          e.target.value = '';
          return;
        }

        setIsScanning(true);
        setStatusScanningText('Otimizando imagem para leitura...');

        try {
          // 1. Converte e comprime para JPEG leve (resolve HEIC de iPhone e fotos pesadas)
          const base64Data = await compressImageForAI(file, 1200, 0.85);

          setStatusScanningText('Gemini Vision analisando comprovante...');

          const prompt = `Analise a foto deste recibo ou nota fiscal (inclusive recibos japoneses 領収書 ou レシート).
Extraia as informações e retorne ESTRITAMENTE um objeto JSON válido no formato:
{
  "estabelecimento": "Nome da loja ou supermercado (ex: TRIAL, Lawson, 7-Eleven, Hospital, etc)",
  "valor": 1234, // Número inteiro do TOTAL pago em ienes (sem ¥, sem pontos)
  "data": "YYYY-MM-DD", // Data da compra no padrão ISO (ex: 2026-09-10). Se o ano não aparecer, use 2026.
  "categoria": "Uma destas: Supermercado & Feira, Alimentação Fora & Lanches, Moradia (Aluguel), Contas Fixas & Utilidades, Serviços Financeiros & Impostos, Saúde & Farmácia, Educação & Filhos, Transporte & Carro, Lazer, Compras & Variados, Pessoal, Roupas & Cuidados",
  "tipo": "Despesa"
}
Retorne exclusivamente o JSON, sem crases, sem markdown e sem nenhum texto antes ou depois.`;

          // Fallback dinâmico com os modelos oficiais mais recentes do Google
          const candidateModels = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-flash-latest'];
          let res = null;
          let lastErrMsg = '';

          for (const modelName of candidateModels) {
            try {
              res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [
                    {
                      parts: [
                        { text: prompt },
                        { inline_data: { mime_type: 'image/jpeg', data: base64Data } }
                      ]
                    }
                  ],
                  generationConfig: {
                    temperature: 0.1,
                    response_mime_type: 'application/json'
                  }
                })
              });
              if (res.ok) break;
              const errJson = await res.json().catch(() => ({}));
              lastErrMsg = errJson.error?.message || `Erro HTTP ${res.status} (${modelName})`;
            } catch (networkErr) {
              lastErrMsg = networkErr.message;
            }
          }

          if (!res || !res.ok) {
            throw new Error(lastErrMsg || 'Falha ao analisar comprovante.');
          }

          const d = await res.json();
          let rawText = d.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
          // Limpa possíveis blocos de código markdown
          rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
          const parsed = JSON.parse(rawText);

          setEditingTransaction({
            tipo: parsed.tipo || 'Despesa',
            valor: parsed.valor ? String(parsed.valor) : '',
            estabelecimento: parsed.estabelecimento || 'Comprovante Lido',
            data: parsed.data || new Date().toISOString().split('T')[0],
            categoria: parsed.categoria || 'Supermercado & Feira',
          });
          setIsModalOpen(true);
          showToast('Comprovante lido com sucesso pela IA!');
        } catch (err) {
          console.error(err);
          showToast('Aviso: ' + err.message, true);
          // Abre o modal mesmo com falha para o usuário não perder a data
          setEditingTransaction({
            tipo: 'Despesa',
            valor: '',
            estabelecimento: 'Comprovante Fotografado',
            data: new Date().toISOString().split('T')[0],
            categoria: 'Supermercado & Feira',
          });
          setIsModalOpen(true);
        } finally {
          setIsScanning(false);
          e.target.value = '';
        }
      };

      // Cálculos
      const receitasTotais = 3984901;
      const despesasTotais = 4186382 + transactions.filter(t => !['tx-1','tx-2','tx-3','tx-4','tx-5','tx-6','tx-7','tx-8'].includes(t.id) && t.tipo === 'Despesa').reduce((acc, t) => acc + (t.valor || 0), 0);

      return (
        <div className="w-full max-w-md mx-auto min-h-screen flex flex-col bg-[#F5F2EB] relative pb-24 select-none">

            </div>

          {/* Top Bar */}
          <header className="px-4 py-3.5 flex justify-between items-center bg-[#F5F2EB]/95 sticky top-0 z-20 backdrop-blur-md border-b border-slate-200/70">
            <div>

                <span className="w-1.5 h-1.5 rounded-full bg-emerald-600 animate-pulse"></span>
                Ativo
              </span>
            </div>
          </header>

          {/* Área de Conteúdo */}
          <main className="p-4 flex-1 overflow-y-auto">
            
            {/* ABA 1: DASHBOARD */}
            {currentTab === 'dashboard' && (
              <div className="space-y-4">
                
                {/* Card de Liquidez */}
                <div className="bg-[#0F2C59] text-white rounded-3xl p-5 shadow-lg relative overflow-hidden">
                  <div className="flex justify-between items-center mb-1">
                    <span className="text-[10px] uppercase tracking-wider text-blue-200 font-bold">Saldo Líquido Acumulado</span>
                    <span className="px-2 py-0.5 bg-rose-600 text-white text-[9px] font-bold rounded-full uppercase tracking-wider">Atenção</span>
                  </div>
                  <h2 className="text-3xl sm:text-4xl font-extrabold text-rose-200 mb-3 tracking-tight">
                    -¥ {Math.abs(saldo).toLocaleString('ja-JP')}
                  </h2>
                  <div className="grid grid-cols-2 gap-2 pt-3 border-t border-blue-900/60 text-xs">
                    <div>
                      <span className="text-[10px] text-blue-300 uppercase">Receitas</span>
                      <p className="font-bold text-emerald-400 text-sm">¥ {receitasTotais.toLocaleString('ja-JP')}</p>
                    </div>
                    <div>
                      <span className="text-[10px] text-blue-300 uppercase">Despesas</span>
                      <p className="font-bold text-rose-300 text-sm">¥ {despesasTotais.toLocaleString('ja-JP')}</p>
                    </div>
                  </div>
                </div>

                {/* Status do Mês */}
                <div className="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-xs flex items-center gap-3">
                  <div className="w-9 h-9 rounded-xl bg-amber-50 text-amber-700 flex items-center justify-center text-lg shrink-0">
                    ⚡
                  </div>
                  <div>
                    <h3 className="text-xs font-bold text-slate-800 uppercase tracking-wide">Setembro em Andamento</h3>
                    <p className="text-xs text-slate-500 mt-0.5">8 movimentos registrados na base central (¥ 32.165)</p>
                  </div>
                </div>

                {/* Maiores Categorias */}
                <div className="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs space-y-3">
                  <h3 className="text-sm font-serif font-bold text-slate-800">Maiores Categorias (2026)</h3>
                  <div className="space-y-2.5 text-xs font-medium">
                    <div>
                      <div className="flex justify-between mb-1">
                        <span className="text-slate-700">1. Supermercado & Feira</span>
                        <span className="font-bold text-slate-900">¥ 1.582.806</span>
                      </div>
                      <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div className="bg-[#0F2C59] h-full w-[38%] rounded-full"></div>

                        <span className="text-slate-700">2. Impostos & Finanças</span>
                        <span className="font-bold text-slate-900">¥ 807.919</span>

                        <span className="font-bold text-slate-900">¥ 509.899</span>

                </div>

                {/* Botão de Registro Rápido */}

                  type="button"
                  onClick={handleOpenCreate}
                  className="w-full py-3.5 bg-[#0F2C59] hover:bg-[#1B3B6F] active:scale-[0.98] text-white font-bold rounded-2xl shadow-md flex items-center justify-center gap-2 text-sm transition"

                  <span className="text-lg leading-none">+</span>

              </div>
            )}

            {/* ABA 2: LANÇAMENTOS (Com Toque para Editar / Excluir) */}

              <div className="space-y-3">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-base font-serif font-bold text-slate-900">Últimos Lançamentos</h2>
                    <p className="text-[11px] text-slate-400">Toque em qualquer card para editar ou excluir</p>
                  </div>
                  <span className="text-[11px] bg-slate-200 text-slate-700 font-bold px-2 py-0.5 rounded-full">
                    {transactions.length}
                  </span>
                </div>

                <div className="space-y-2">
                  {transactions.map((t) => (
                    <div
                      key={t.id}
                      onClick={() => handleOpenEdit(t)}
                      className="bg-white p-3 rounded-2xl border border-slate-200/80 shadow-xs flex justify-between items-center text-xs active:bg-slate-50 transition cursor-pointer"
                    >
                      <div className="flex items-center gap-2.5 min-w-0 pr-2">
                        <div className={`w-8 h-8 rounded-xl flex items-center justify-center shrink-0 font-bold text-sm ${t.tipo === 'Despesa' ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-600'}`}>
                          {t.tipo === 'Despesa' ? '↓' : '↑'}
                        </div>
                        <div className="min-w-0">
                          <h4 className="font-bold text-slate-800 text-sm truncate">{t.estabelecimento || t.categoria}</h4>
                          <p className="text-slate-400 text-[11px] truncate">{t.data} • {t.categoria}</p>
                        </div>
                      </div>
                      
                      <div className="flex items-center gap-2 shrink-0">
                        <span className={`font-bold text-sm ${t.tipo === 'Despesa' ? 'text-slate-900' : 'text-emerald-600'}`}>
                          {t.tipo === 'Despesa' ? '-' : '+'}¥ {Math.round(t.valor).toLocaleString('ja-JP')}
                        </span>
                        <span className="text-slate-400 text-sm font-bold pl-1">›</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ABA 3: CONEXÃO COM TESTE DA CHAVE */}
            {currentTab === 'config' && (
              <div className="bg-white p-5 rounded-3xl border border-slate-200 space-y-4 text-xs">
                <h2 className="text-base font-serif font-bold text-slate-800">Conexão Google & IA</h2>
                
                <div>
                  <label className="block font-bold text-slate-500 mb-1">ID da Planilha (Google Drive)</label>
                  <input type="text" readOnly value={SPREADSHEET_ID} className="w-full p-2 bg-slate-100 rounded-xl text-slate-600 font-mono text-[11px] outline-none" />
                </div>

                <div className="pt-2 border-t border-slate-100 space-y-2">
                  <div className="flex justify-between items-center">
                    <label className="block font-bold text-slate-700">Chave Gemini API (OCR Recibos)</label>
                    <a
                      href="https://aistudio.google.com/app/apikey"
                      target="_blank"
                      rel="noopener noreferrer"
                      className="text-[11px] text-blue-600 font-bold hover:underline"
                    >
                      Obter chave grátis ↗
                    </a>
                  </div>
                  
                  <input
                    type="password"
                    placeholder="AIzaSy..."
                    value={geminiApiKey}
                    onChange={(e) => {
                      const val = e.target.value.trim();
                      setGeminiApiKey(val);
                      localStorage.setItem('fc26_gemini_api_key', val);
                    }}
                    className="w-full p-2.5 border border-slate-300 rounded-xl outline-none focus:border-[#0F2C59] font-mono text-xs"
                  />

                  <button
                    type="button"
                    onClick={handleTestApiKey}
                    disabled={isTestingKey}
                    className="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition"
                  >
                    {isTestingKey ? 'Testando conexão...' : '⚡ Testar se a Chave está funcionando'}
                  </button>
                  
                  <div className="mt-2 p-3 bg-amber-50 rounded-xl border border-amber-200/60 text-amber-900 text-[11px] leading-relaxed">
                    <strong>💡 Como funciona a leitura por foto:</strong><br />
                    Ao tocar no botão 📷, a foto é compactada e enviada para o Google Gemini Vision. Ele lê comprovantes em japonês e português, descobrindo o valor pago em Ienes (¥), data e estabelecimento automaticamente.
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Botão FAB Flutuante de Câmera */}
          <input
            type="file"
            ref={fileInputRef}
            onChange={handleCapture}
            accept="image/*"
            capture="environment"
            className="hidden"
          />
          <button
            type="button"
            onClick={() => {
              if (!geminiApiKey.trim()) {
                showToast('Cole a chave da Gemini API na aba Conexão primeiro.', true);
                setCurrentTab('config');
              } else {
                fileInputRef.current?.click();
              }
            }}
            disabled={isScanning}
            className="fixed bottom-20 right-4 z-30 w-[52px] h-[52px] bg-[#0F2C59] text-white rounded-full flex items-center justify-center shadow-2xl active:scale-90 transition border-2 border-white text-xl"
            title="Tirar foto do comprovante com IA"
          >
            {isScanning ? '⏳' : '📷'}
          </button>

          {/* Bottom Sheet Modal (Criar / Editar / Excluir) */}
          {isModalOpen && (
            <OneTapModal
              onClose={() => { setIsModalOpen(false); setEditingTransaction(null); }}
              onSave={handleSave}
              onDelete={handleDelete}
              initialData={editingTransaction}
            />
          )}

          {/* Barra de Navegação Inferior */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#FDFBF7]/95 border-t border-slate-200/80 px-6 pt-2 pb-[max(0.75rem,env(safe-area-inset-bottom))] flex justify-around items-center z-20 backdrop-blur-md">
            <button
              type="button"
              onClick={() => setCurrentTab('dashboard')}
              className={`flex flex-col items-center gap-0.5 text-[11px] font-medium transition ${currentTab === 'dashboard' ? 'text-[#0F2C59] font-bold' : 'text-slate-400'}`}
            >
              <span className="text-base">📊</span>
              <span>Dashboard</span>
            </button>
            <button
              type="button"
              onClick={() => setCurrentTab('lancamentos')}
              className={`flex flex-col items-center gap-0.5 text-[11px] font-medium transition ${currentTab === 'lancamentos' ? 'text-[#0F2C59] font-bold' : 'text-slate-400'}`}
            >
              <span className="text-base">📝</span>
              <span>Lançamentos</span>
            </button>
            <button
              type="button"
              onClick={() => setCurrentTab('config')}
              className={`flex flex-col items-center gap-0.5 text-[11px] font-medium transition ${currentTab === 'config' ? 'text-[#0F2C59] font-bold' : 'text-slate-400'}`}
            >
              <span className="text-base">⚙️</span>
              <span>Conexão</span>
            </button>
          </nav>

        </div>
      );
    }

    /**
     * Modal Otimizado para Mobile (iPhone 14 & Pixel 7)
     * - Edição Completa
     * - Botão de Excluir
     * - Rodapé Fixo e Botão Sempre Visível
     */
    function OneTapModal({ onClose, onSave, onDelete, initialData }) {
      const isEditing = !!(initialData && initialData.id);
      const [tipo, setTipo] = useState(initialData?.tipo || 'Despesa');
      const [valor, setValor] = useState(initialData?.valor ? String(initialData.valor) : '');
      const [categoria, setCategoria] = useState(initialData?.categoria || 'Supermercado & Feira');
      const [estabelecimento, setEstabelecimento] = useState(initialData?.estabelecimento || '');
      const [data, setData] = useState(initialData?.data || new Date().toISOString().split('T')[0]);

      const categorias = tipo === 'Despesa' ? CATEGORIAS_DESPESA : CATEGORIAS_RECEITA;

      const submit = (e) => {
        if (e) e.preventDefault();
        const num = parseFloat(valor);
        if (!num || num <= 0) {
          alert('Por favor, informe um valor numérico válido.');
          return;
        }
        onSave({
          data,
          tipo,
          categoria,
          valor: num,
          estabelecimento: estabelecimento.trim() || categoria
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end justify-center animate-in fade-in duration-200">
          
          <div className="bg-[#FDFBF7] w-full max-w-md rounded-t-[28px] shadow-2xl flex flex-col max-h-[90vh] max-h-[90dvh] border-t border-slate-200">
            
            {/* Header Fixo */}
            <div className="px-5 py-3.5 border-b border-slate-200 flex justify-between items-center shrink-0">
              <div className="flex items-center gap-2">
                <span className={`w-2 h-2 rounded-full ${isEditing ? 'bg-amber-500' : 'bg-[#0F2C59]'}`}></span>
                <h3 className="font-serif font-bold text-slate-900 text-lg">
                  {isEditing ? 'Editar Lançamento' : 'Novo Lançamento'}
                </h3>
              </div>
              <button 
                type="button"
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 text-sm font-bold active:scale-95"
              >
                ✕
              </button>
            </div>

            {/* Conteúdo com Rolagem */}
            <form onSubmit={submit} className="flex-1 overflow-y-auto px-5 py-3.5 space-y-4">
              
              {/* Segmentação Despesa / Receita */}
              <div className="grid grid-cols-2 gap-1.5 bg-slate-100 p-1 rounded-2xl">
                <button
                  type="button"
                  onClick={() => { setTipo('Despesa'); setCategoria(CATEGORIAS_DESPESA[0].id); }}
                  className={`py-2 rounded-xl text-xs font-bold transition ${
                    tipo === 'Despesa' ? 'bg-white text-rose-600 shadow-xs' : 'text-slate-500'
                  }`}
                >
                  ↓ Despesa
                </button>
                <button
                  type="button"
                  onClick={() => { setTipo('Receita'); setCategoria(CATEGORIAS_RECEITA[0].id); }}
                  className={`py-2 rounded-xl text-xs font-bold transition ${
                    tipo === 'Receita' ? 'bg-white text-emerald-600 shadow-xs' : 'text-slate-500'
                  }`}
                >
                  ↑ Receita
                </button>
              </div>

              {/* Campo de Valor com Teclado Numérico */}
              <div>
                <label className="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">
                  Valor (¥)
                </label>
                <div className="relative">
                  <span className="absolute left-4 top-1/2 -translate-y-1/2 text-2xl font-bold text-slate-400">¥</span>
                  <input
                    type="text"
                    inputMode="numeric"
                    pattern="[0-9]*"
                    autoFocus
                    placeholder="0"
                    value={valor}
                    onChange={(e) => setValor(e.target.value.replace(/[^0-9]/g, ''))}
                    className="w-full pl-11 pr-4 py-2.5 bg-white border border-slate-300 focus:border-[#0F2C59] rounded-2xl text-2xl font-extrabold text-[#0F2C59] outline-none"
                  />
                </div>
              </div>

              {/* Categorias em Grid 2 Colunas Limpo */}
              <div>
                <label className="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">
                  Categoria (Selecione em 1 toque)
                </label>
                <div className="grid grid-cols-2 gap-1.5 max-h-44 overflow-y-auto pr-1">
                  {categorias.map((c) => {
                    const isSelected = categoria === c.id;
                    return (
                      <button
                        key={c.id}
                        type="button"
                        onClick={() => setCategoria(c.id)}
                        className={`flex items-center gap-1.5 p-2 rounded-xl text-xs font-medium text-left transition active:scale-95 border ${
                          isSelected
                            ? 'bg-[#0F2C59] text-white border-[#0F2C59] font-bold shadow-xs'
                            : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                        }`}
                      >
                        <span className="text-sm shrink-0">{c.icon}</span>
                        <span className="truncate">{c.label}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Estabelecimento */}
              <div>
                <label className="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">
                  Estabelecimento / Loja
                </label>
                <input
                  type="text"
                  placeholder="Ex: Trial, Lawson, Supermercado"
                  value={estabelecimento}
                  onChange={(e) => setEstabelecimento(e.target.value)}
                  className="w-full px-3 py-2 bg-white border border-slate-300 focus:border-[#0F2C59] rounded-xl text-sm font-medium text-slate-800 outline-none"
                />
              </div>

              {/* Data */}
              <div>
                <label className="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">
                  Data
                </label>
                <input
                  type="date"
                  value={data}
                  onChange={(e) => setData(e.target.value)}
                  className="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm font-medium text-slate-800 outline-none"
                />
              </div>

            </form>

            {/* Rodapé Fixo com Botão de Salvar e Excluir */}
            <div className="p-4 pt-2.5 bg-[#FDFBF7] border-t border-slate-200 shrink-0 pb-[max(1rem,env(safe-area-inset-bottom))] space-y-2">
              <button
                type="button"
                onClick={submit}
                disabled={!valor}
                className="w-full py-3.5 bg-[#0F2C59] hover:bg-[#1B3B6F] disabled:opacity-50 active:scale-[0.98] text-white font-bold rounded-2xl shadow-lg flex items-center justify-center gap-2 text-sm transition"
              >
                <span>✓</span>
                <span>{isEditing ? 'Salvar Alterações' : 'Salvar Lançamento'}</span>
              </button>

              {isEditing && (
                <button
                  type="button"
                  onClick={() => onDelete(initialData.id)}
                  className="w-full py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-xl text-xs transition"
                >
                  🗑 Excluir este Lançamento
                </button>
              )}
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
