    function isDespesaTx(t) {

    // AUDITORIA INTELIGENTE DE DUPLICIDADE EM TEMPO REAL
    function verificarDuplicidade(novoTx, listaExistente) {
      if (!novoTx || !novoTx.valor || !novoTx.estabelecimento) return null;
      const novoValor = parseFloat(novoTx.valor) || 0;
      const novaLoja = padronizarNomeLoja(novoTx.estabelecimento).toLowerCase();
      const novaData = novoTx.data || '';

      for (const tx of listaExistente) {
        if (novoTx.id && tx.id === novoTx.id) continue;

        const valExistente = parseFloat(tx.valor) || 0;
        const lojaExistente = padronizarNomeLoja(tx.estabelecimento).toLowerCase();
        const dataExistente = tx.data || '';

        const mesmoValor = Math.abs(valExistente - novoValor) === 0;
        const mesmaLoja = (
          lojaExistente === novaLoja ||
          lojaExistente.includes(novaLoja) ||
          novaLoja.includes(lojaExistente)
        );

        let diasDiff = 999;
        if (novaData && dataExistente) {
          const d1 = new Date(novaData);
          const d2 = new Date(dataExistente);
          if (!isNaN(d1.getTime()) && !isNaN(d2.getTime())) {
            diasDiff = Math.abs((d1 - d2) / (1000 * 60 * 60 * 24));
          }
        }

        // Se for mesma loja, mesmo valor e ocorrido no mesmo dia ou nos últimos 4 dias
        if (mesmoValor && mesmaLoja && diasDiff <= 4) {
          return {
            existente: tx,
            diasDiff: Math.round(diasDiff),
            motivo: diasDiff === 0 
              ? 'Lançamento com mesmo valor e mesma loja registrado na mesma data!'
              : `Lançamento idêntico registrado com ${Math.round(diasDiff)} dia(s) de diferença!`
          };
        }
      }
      return null;
    }

    function padronizarNomeLoja(nomeBruto) {
      if (!nomeBruto || typeof nomeBruto !== 'string') return 'TRIAL スーパー';
      const limpo = nomeBruto.trim();
      
      // Salvaguarda expressa para Companhia de Água e Esgoto de Izumo
      if (limpo.includes('水道') || limpo.includes('上下水道局')) {
        return '出雲市上下水道局';
      }
      
      // Procura regra de unificação
      for (const regra of REGRAS_PADRONIZACAO) {
        if (regra.regex.test(limpo)) {
          return regra.nomeOficial;
        }
      }
      
      // Se for apenas a palavra genérica "Supermercado", converte para o principal supermercado de rotina
      if (/^supermercado$/i.test(limpo)) {
        return 'TRIAL スーパー';
      }
      
      // Capitaliza a primeira letra e remove pontuações estranhas
      return limpo.charAt(0).toUpperCase() + limpo.slice(1);
    }

    // Otimização de imagem para Canvas
    function compressImageForAI(file, maxDim = 1200, quality = 0.85) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > h) {
              if (w > maxDim) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              }
            } else {
              if (h > maxDim) {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const jpegDataUrl = canvas.toDataURL('image/jpeg', quality);
            const base64 = jpegDataUrl.split(',')[1];
            resolve(base64);
          };
          img.onerror = () => reject(new Error('Erro ao processar imagem.'));
        };
        reader.onerror = () => reject(new Error('Erro ao ler foto.'));
      });
    }

      // Carrega dados da Planilha em tempo real via Apps Script na inicialização
      useEffect(() => {
        const formatData = (d) => {
          if (!d) return '';
          if (typeof d === 'string' && d.includes('T')) return d.split('T')[0];
          try {
            const dt = new Date(d);

          try {
            const res = await fetch(APPS_SCRIPT_URL);
            if (!res.ok) return;
            const data = await res.json();

            // 1. Processa Lançamentos
            let rows = [];
            if (Array.isArray(data)) {
              rows = data;
            } else if (data && data.rows) {
              rows = data.rows;

            if (Array.isArray(rows) && rows.length > 1) {

                    unicos.push(item);

          Object.keys(estadoAnterior[parKey].series || {}).forEach(tf => {

        const brutoMax = Math.max(...pontos);
        const margem = Math.max((brutoMax - brutoMin) * 0.2, Math.abs(valor) * 0.00015, 0.0001);
        return {
          ...(serieAnterior || {}),
          pts: pontos,
          datas: ['-60s', '-45s', '-30s', '-15s', new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })],
          max: brutoMax + margem,
          med: (brutoMin + brutoMax) / 2,
          min: brutoMin - margem
        };
      };

        Object.keys(cotacoes).forEach(parKey => {

          const valor = Number(item?.valor);
          if (!par || !Number.isFinite(valor)) return;

          const cotacaoAnterior = Number(par.cotacao);
          const temAmostraAnterior = par.dataTexto && Number.isFinite(cotacaoAnterior) && cotacaoAnterior > 0;
          const variacaoReal = temAmostraAnterior
            ? ((valor - cotacaoAnterior) / cotacaoAnterior) * 100
            : 0;
          par.cotacao = valor;
          par.variacao = variacaoReal;

        '2026_11': [3, 23]
      };

      // Memos e Marcas (マーク) de cada dia (salvo por perfil, ano e mês)

        1: { mark: '🩸', memo: '' },
        5: { mark: '保険', memo: 'Seguro / Documentação' },
        11: { mark: '👣', memo: 'Exame de rotina' },
        14: { mark: '外出', memo: 'Saída com retorno' },

        } catch(e) {

      });

      const chaveMemosAtual = `${perfilEscala}_${anoCalendario}_${mesCalendario + 1}`;
      const memosDoMes = todosMemos[chaveMemosAtual] || {};

      // Configuração de Nomes e Cores dos 7 Turnos (設定)
      const CONFIG_TURNOS_PADRAO = [
        { id: '1', nome: '村田カレンダー', 略号: '休', bg: '#86efac', text: '#064e3b' },
        { id: '2', nome: 'エイコー出勤', 略号: '出勤', bg: '#38bdf8', text: '#0f172a' },
        { id: '3', nome: 'エイコー休出', 略号: '休出', bg: '#1e3a8a', text: '#ffffff' },
        { id: '4', nome: 'エイコー欠勤', 略号: '欠勤', bg: '#2563eb', text: '#ffffff' },
        { id: '5', nome: 'エイコー休み', 略号: '休み', bg: '#f59e0b', text: '#0f172a' },
        { id: '6', nome: 'エイコー早退', 略号: '早退', bg: '#fef08a', text: '#0f172a' },
        { id: '7', nome: 'エイコー遅刻', 略号: '遅刻', bg: '#dc2626', text: '#ffffff' },
        { id: '8', nome: '外出 (Saída c/ retorno)', 略号: '外出', bg: '#fbcfe8', text: '#831843' }
      ];

      const [configTurnos, setConfigTurnos] = useState(() => {
        try {
          const local = localStorage.getItem('fc26_config_turnos');
          return local ? JSON.parse(local) : CONFIG_TURNOS_PADRAO;
        } catch(e) {
          return CONFIG_TURNOS_PADRAO;
        }
      });

      // Salvar Memo e Marca do Dia
      const handleSalvarMemo = (dia, mark, memo, novoCarimbo = null) => {
        const novosMemosDoMes = {
          ...memosDoMes,
          [dia]: { mark: mark || '', memo: memo || '' }
        };
        const novosTodosMemos = {
          ...todosMemos,
          [chaveMemosAtual]: novosMemosDoMes
        };
        setTodosMemos(novosTodosMemos);
        try {
          localStorage.setItem('fc26_todos_memos', JSON.stringify(novosTodosMemos));
        } catch(e){}

        if (novoCarimbo !== null) {
          const novaEscalaDoMes = { ...escalaMes };
          if (novoCarimbo) {
            novaEscalaDoMes[dia] = novoCarimbo;
          } else {
            delete novaEscalaDoMes[dia];
          }
          const novasTodasEscalas = {
            ...todasEscalas,
            [chaveMesAtual]: novaEscalaDoMes

        setIsModalMemoOpen(false);

      // Disparar sincronização manual
      const handleSincronizarNuvemManual = () => {

      // Navegação de Meses
      const handleMesAnterior = () => {

          setAnoCalendario(a => a + 1);
        } else {
          setMesCalendario(m => m + 1);
        }
      };

      // Alterna carimbo ao clicar diretamente dentro do campo do dia (ciclo ou carimbo ativo)
      const handleDiaClick = (dia) => {
        if (!dia || !modoEntrada) return; // Bloqueado para edição se 入力モード estiver desabilitado!
        const atual = escalaMes[dia] || '';
        let novo = '';

        if (carimboAtivo !== null) {
          novo = atual === carimboAtivo ? '' : carimboAtivo;
        } else {
          // Ciclo completo por clique direto dentro do dia incluindo 外出
          const ciclo = ['', '休', '出勤', '休出', '欠勤', '休み', '早退', '遅刻', '外出'];
          const proxIdx = (ciclo.indexOf(atual) + 1) % ciclo.length;
          novo = ciclo[proxIdx];
        }

        const novaEscalaDoMes = { ...escalaMes };
        if (novo) {
          novaEscalaDoMes[dia] = novo;
        } else {
          delete novaEscalaDoMes[dia];
        }

        const novasTodasEscalas = {
          ...todasEscalas,
          [chaveMesAtual]: novaEscalaDoMes
        };

          localStorage.setItem('fc26_todas_escalas', JSON.stringify(novasTodasEscalas));

        // Envia a escala do casal para a Planilha Google em segundo plano
        try {
          fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'save_escala',
              todasEscalas: novasTodasEscalas,
              updatedBy: perfilEscala === 'usuario' ? 'オスマン' : 'シルレイ'
            })
          }).then(() => {
            showToast('✓ Escala sincronizada na nuvem com seu parceiro(a)!');
          }).catch(e => console.warn(e));
        } catch(e){}
      };
      const [toastMessage, setToastMessage] = useState(null);

      const [isScanning, setIsScanning] = useState(false);

            { wch: 14 },

          showToast('✓ Arquivo Excel (.xlsx) baixado com sucesso!');
        } catch(err) {
          console.error(err);
          showToast('Erro ao exportar Excel: ' + err.message, true);
        }
      };

      // Salva Lançamento com Auditoria Automática de Duplicidade
      const handleSave = async (txData, forcarGravacao = false) => {
        const dadosPadronizados = {

        if (!forcarGravacao && (!editingTransaction || !editingTransaction.id)) {

              motivo: dupFound.motivo

        let updatedList;
        if (editingTransaction && editingTransaction.id) {
          updatedList = transactions.map(t => t.id === editingTransaction.id ? { ...dadosPadronizados, id: t.id } : t);
          showToast('Lançamento atualizado!');
        } else {
          const newTx = { ...dadosPadronizados, id: 'tx-' + Date.now() };
          updatedList = [newTx, ...transactions];
          showToast('Lançamento registrado com sucesso!');

        setTransactions(updatedList);
        try {
          localStorage.setItem('fc26_transactions', JSON.stringify(updatedList));
        } catch(e){}

        // Sincronização em Tempo Real na Nuvem via Google Apps Script (Multi-aparelho sem login)
        try {
          // Envia em segundo plano para a planilha no Google Drive
          fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', // Garante compatibilidade imediata sem bloquear no CORS
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(dadosPadronizados)
          }).then(() => {
            showToast('✓ Gravado na Planilha Google Drive em tempo real!');
          }).catch(err => {
            console.warn('Aviso sincronização:', err);
          });
        } catch(e) {
          console.warn(e);
        }
      };

      const handleDelete = async (idToDelete) => {
        const itemParaExcluir = transactions.find(t => t.id === idToDelete);
        if (!itemParaExcluir) return;

        if (!confirm(`Deseja realmente excluir e estornar o lançamento de ¥ ${Math.round(itemParaExcluir.valor).toLocaleString('ja-JP')} (${itemParaExcluir.estabelecimento})?`)) return;

        // 1. Atualização local imediata
        const updatedList = transactions.filter(t => t.id !== idToDelete);
        setTransactions(updatedList);
        try {
          localStorage.setItem('fc26_transactions', JSON.stringify(updatedList));
        } catch(e){}
        setIsModalOpen(false);
        setEditingTransaction(null);
        showToast('Lançamento excluído localmente. Estornando na Planilha Google...');

        // 2. Dispara a exclusão e estorno real na Planilha Google via Apps Script
        try {
          fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'delete_row',
              data: itemParaExcluir.data,
              valor: itemParaExcluir.valor,
              estabelecimento: itemParaExcluir.estabelecimento,
              tipo: itemParaExcluir.tipo,
              categoria: itemParaExcluir.categoria
            })
          }).then(() => {
            showToast('✓ Lançamento estornado e excluído da Planilha Google!');
          }).catch(err => {
            console.warn('Aviso ao excluir na nuvem:', err);
          });
        } catch(err) {
          console.warn(err);
        }
      };

      // Testar chave Gemini consultando diretamente a lista de modelos ativos da sua conta
      const handleTestApiKey = async () => {
        const key = geminiApiKey.trim();
        if (!key) {
          showToast('Cole a chave da API primeiro.', true);
          return;
        }
        setIsTestingKey(true);
        try {
          // Consulta quais modelos estão liberados para esta chave
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error?.message || 'Chave recusada pelo Google.');
          }
          const data = await res.json();
          const modelosValidos = (data.models || [])
            .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'))
            .map(m => m.name.replace('models/', ''));
          
          showToast(`✓ Chave válida! ${modelosValidos.length} modelos de IA disponíveis.`);
        } catch(err) {
          showToast('Erro: ' + err.message, true);
        } finally {
          setIsTestingKey(false);
        }
      };

      // Captura Inteligente com OCR e Padronizador
      const handleCapture = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const key = geminiApiKey.trim();
        if (!key) {
          showToast('Insira a chave da Gemini API na aba Conexão.', true);
          setCurrentTab('config');
          e.target.value = '';
          return;
        }

        setIsScanning(true);
        setScanStep(1); // 1: Otimizando imagem

        try {
          const base64Data = await compressImageForAI(file, 1200, 0.85);

          setScanStep(2); // 2: IA lendo comprovante

          const prompt = `Analise este recibo/nota fiscal (领収书 ou レシート).
IMPORTANTE PARA O ESTABELECIMENTO:
- Identifique o nome EXATO e ESPECÍFICO do estabelecimento impresso no topo (ex: TRIAL, Lawson, 7-Eleven, あんり, Cosmos, Nitori, AEON).
- NUNCA retorne nomes genéricos como "Supermercado" ou "Loja". Se for um supermercado Trial, retorne "TRIAL".

Extraia no formato JSON estrito:
{
  "estabelecimento": "Nome da loja",
  "valor": 1234, // TOTAL pago em ienes como inteiro (sem ¥)
  "data": "YYYY-MM-DD", // Data da compra no formato ISO (ex: 2026-09-10). Se ano ausente, use 2026.
  "categoria": "Supermercado & Feira", // Uma das categorias padrão
  "tipo": "Despesa"
}
Retorne exclusivamente o JSON, sem crases markdown.`;

          // Descoberta dinâmica com prioridade absoluta para a geração Gemini 3.5 recomendada pelo Google
          const modelsOrder = [
            'gemini-3.5-flash-lite',
            'gemini-3.5-flash',
            'gemini-2.5-flash',
            'gemini-flash-latest'
          ];

          // Gera endpoints testando tanto v1beta quanto v1
          const endpointsToTry = [];
          for (const m of modelsOrder) {
            endpointsToTry.push(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`);
            endpointsToTry.push(`https://generativelanguage.googleapis.com/v1/models/${m}:generateContent`);
          }

          let res = null;
          let lastErr = '';
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          for (const endpointUrl of endpointsToTry) {
            try {
              res = await fetch(`${endpointUrl}?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [
                    {
                      parts: [
                        { text: prompt },
                        { inline_data: { mime_type: 'image/jpeg', data: base64Data } }
                      ]
                    }
                  ],
                  generationConfig: {
                    temperature: 0.1
                  }
                })
              });

              if (res.ok) {
                break;
              } else {
                const errJson = await res.json().catch(() => ({}));
                lastErr = errJson.error?.message || `Erro ${res.status}`;
                // Se for 503 ou 429, aguarda 1.5s antes do próximo endpoint
                if (res.status === 503 || res.status === 429) {
                  await sleep(1500);
                }
              }
            } catch(netErr) {
              lastErr = netErr.message;
            }
          }

          if (!res || !res.ok) {
            throw new Error(lastErr || 'Servidor da IA ocupado. Tente novamente em instantes.');
          }

          setScanStep(3); // 3: Padronizando dados

          const d = await res.json();
          let rawText = d.candidates?.[0]?.content?.parts?.[0]?.text || '';
          
          // Extração segura por regex do objeto JSON retornado no texto
          let parsed = {};
          try {
            const match = rawText.match(/\{[\s\S]*\}/);
            if (match) parsed = JSON.parse(match[0]);
          } catch(e) {
            console.warn('Erro ao parsear JSON:', e);
          }

          // Aplica o normalizador de estabelecimentos
          const lojaPadronizada = padronizarNomeLoja(parsed.estabelecimento);

          setEditingTransaction({
            tipo: parsed.tipo || 'Despesa',

            estabelecimento: lojaPadronizada,

            categoria: parsed.categoria || 'Supermercado & Feira',

          setIsModalOpen(true);
          showToast(`✓ Comprovante lido: ${lojaPadronizada}!`);
        } catch(err) {

          showToast('Aviso: ' + err.message, true);
          setEditingTransaction({
            tipo: 'Despesa',
            valor: '',
            estabelecimento: 'TRIAL スーパー',
            data: new Date().toISOString().split('T')[0],
            categoria: 'Supermercado & Feira',
          });
          setIsModalOpen(true);
        } finally {
          setIsScanning(false);
          e.target.value = '';
        }
      };

      // Totais calculados dinamicamente em tempo real a partir de todos os registros da planilha
      const receitasTotais = transactions.filter(t => !isDespesaTx(t)).reduce((acc, t) => acc + (t.valor || 0), 0) || 3984901;
      const despesasTotais = transactions.filter(t => isDespesaTx(t)).reduce((acc, t) => acc + (t.valor || 0), 0) || 4186382;
      const saldo = receitasTotais - despesasTotais;

      // CÁLCULOS DINÂMICOS EM TEMPO REAL PARA O MÊS EM ANDAMENTO
      const prefixoMesAtual = `${anoCalendario}-${String(mesCalendario + 1).padStart(2, '0')}`;
      const nomeMesAtual = NOMES_MESES[mesCalendario] || 'Setembro';
      const txMesAtual = transactions.filter(t => {
        if (!t) return false;
        const d = String(t.data || '');
        const m = String(t.mes || '');
        return d.startsWith(prefixoMesAtual) || m.toLowerCase().includes(nomeMesAtual.toLowerCase());
      });
      const qtdMovimentosMesAtual = txMesAtual.length;
      const despesasMesAtual = txMesAtual
        .filter(t => isDespesaTx(t))
        .reduce((acc, t) => acc + (parseFloat(t.valor) || 0), 0);

      // CÁLCULO DINÂMICO DAS MAIORES CATEGORIAS
      const mapaCategorias = {};
      transactions.filter(t => isDespesaTx(t)).forEach(t => {
        const cat = t.categoria || 'Outros';
        mapaCategorias[cat] = (mapaCategorias[cat] || 0) + (parseFloat(t.valor) || 0);
      });

      const topCategoriasDinamicas = Object.entries(mapaCategorias)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);

      return (
        <div className="w-full max-w-md mx-auto min-h-screen flex flex-col bg-[#F5F2EB] relative pb-24 select-none">
          
          {/* POPUP / BANNER DE ATUALIZAÇÃO EM TEMPO REAL */}
          {popupNotificacao && (
            <div className="fixed top-14 left-4 right-4 z-50 bg-[#0F2C59] text-white p-3.5 rounded-2xl shadow-2xl border-2 border-emerald-400/80 flex items-center justify-between animate-in slide-in-from-top duration-300">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-emerald-500/20 text-emerald-300 flex items-center justify-center text-xl shrink-0 animate-bounce">
                  🔔
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="text-[10px] uppercase font-bold tracking-wider text-emerald-300">Atualização Recebida</span>
                    <span className="text-[10px] text-slate-400">• {popupNotificacao.hora}</span>
                  </div>
                  <h4 className="text-xs font-bold text-white">
                    {popupNotificacao.local} atualizado {popupNotificacao.autor ? `por ${popupNotificacao.autor}` : 'na base'}!
                  </h4>
                </div>
              </div>
              <button
                type="button"
                onClick={() => setPopupNotificacao(null)}
                className="text-slate-400 hover:text-white text-sm font-bold p-1 ml-2"
              >
                ✕
              </button>
            </div>
          )}

          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-3 left-4 right-4 z-50 px-4 py-3 bg-[#081B38] text-white text-xs font-semibold rounded-2xl shadow-2xl border border-slate-700 flex items-center justify-center gap-2 animate-in fade-in slide-in-from-top duration-200">
              <span className={toastMessage.isError ? "text-rose-400" : "text-emerald-400"}>●</span>
              <span className="text-center">{toastMessage.msg}</span>

          {isScanning && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex flex-col items-center justify-center text-white p-6 animate-in fade-in">
              
              {/* Moldura Holográfica do Recibo */}
              <div className="relative w-44 h-56 bg-white/10 rounded-2xl border-2 border-emerald-400/60 p-3 flex flex-col justify-between overflow-hidden shadow-[0_0_30px_rgba(16,185,129,0.3)] mb-5">
                {/* Linha do Laser do Scanner */}

                {/* Linhas simulando itens do recibo */}
                <div className="space-y-2 opacity-60">
                  <div className="h-2 bg-slate-300 rounded w-2/3 mx-auto"></div>
                  <div className="h-1.5 bg-slate-400 rounded w-full"></div>
                  <div className="h-1.5 bg-slate-400 rounded w-5/6"></div>
                  <div className="h-1.5 bg-slate-400 rounded w-4/5"></div>
                  <div className="h-1.5 bg-slate-400 rounded w-3/4"></div>
                </div>

                    {isTestingKey ? 'Testando conexão...' : '⚡ Testar se a Chave está funcionando'}

                  <div className="mt-2 p-3 bg-blue-50 rounded-xl border border-blue-200/60 text-blue-900 text-[11px] leading-relaxed">
                    <strong>Padronização Automática:</strong><br />
                    O aplicativo agora converte automaticamente nomes de comprovantes (ex: TRIAL, Lawson, Anri, Hospital) para o padrão oficial, sem deixar nomes genéricos como "Supermercado".
                  </div>

            )}

          {/* Botão FAB Flutuante de Câmera */}

            disabled={isScanning}
            className="fixed bottom-20 right-4 z-30 w-[52px] h-[52px] bg-[#0F2C59] text-white rounded-full flex items-center justify-center shadow-2xl active:scale-90 transition border-2 border-white text-xl"

          {/* MODAL DE AUDITORIA INTELIGENTE DE DUPLICIDADE */}

                    <div className="flex justify-between items-center font-bold text-slate-800">

                      <span className="text-rose-600 font-bold">¥ {Math.round(alertaDuplicado.existente.valor).toLocaleString('ja-JP')}</span>
                    </div>

                      <span>{alertaDuplicado.novoTx.estabelecimento}</span>
                      <span className="text-rose-600 font-bold">¥ {Math.round(alertaDuplicado.novoTx.valor).toLocaleString('ja-JP')}</span>
                    </div>
                    <p className="text-[10px] text-slate-500">{alertaDuplicado.novoTx.data} • {alertaDuplicado.novoTx.categoria}</p>
                  </div>

                {/* Botões de Ação */}

          {/* MODAL DE EDIÇÃO DO DIA (MEMO & MARCAÇÃO) - Estilo Screenshot 2 */}

                        defaultValue={infoDia.memo || ''}
                        placeholder="例: 13:05~16:00 残業 30'"
                        className="w-full p-2.5 bg-emerald-50/70 border border-emerald-300 rounded-xl outline-none font-medium text-slate-800 focus:border-emerald-600 leading-relaxed"
                      />
                    </div>

                    {/* Botões de Ação */}
                    <div className="pt-2 flex gap-2">
                      <button
                        type="button"
                        onClick={() => handleSalvarMemo(diaEditando, '', '', '')}
                        className="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-xs transition"
                      >
                        Limpar Dia
                      </button>
                      <button
                        type="submit"
                        className="flex-1 py-2.5 bg-[#0F2C59] hover:bg-[#1B3B6F] text-white font-bold rounded-xl text-xs shadow-md transition"
                      >
                        ✓ Salvar Anotações
                      </button>
                    </div>

                  </form>
                </div>
              </div>
            );
          })()}

          {/* MODAL DE CONFIGURAÇÕES (設定) - Estilo Screenshot 3 (勤務登録) */}
          {isModalConfigTurnosOpen && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-xs flex items-center justify-center p-4 animate-in fade-in">
              <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl border border-slate-200 space-y-4 max-h-[90vh] overflow-y-auto">
                
                {/* Cabeçalho de Configurações */}
                <div className="flex justify-between items-center pb-2 border-b border-amber-400">
                  <button
                    type="button"
                    onClick={() => setIsModalConfigTurnosOpen(false)}
                    className="text-xs font-bold text-slate-600 hover:text-slate-900 bg-slate-100 px-2.5 py-1 rounded-lg"
                  >
                    戻る (Voltar)
                  </button>
                  <h3 className="font-bold text-slate-900 text-base">
                    勤務登録 (Configurações)
                  </h3>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <span className="text-[11px] font-bold bg-amber-100 text-amber-900 px-2 py-0.5 rounded-md inline-block mb-2">
                      勤務名入力 (Personalizar Nomes e Abreviações)
                    </span>
                    
                    <div className="space-y-2">
                      {configTurnos.map((t, idx) => (
                        <div key={t.id} className="flex items-center gap-2 p-1.5 bg-slate-50 rounded-xl border border-slate-200">
                          <span className="text-[10px] font-bold text-slate-500 w-12 shrink-0">
                            勤務 {idx + 1}
                          </span>
                          <input
                            type="text"
                            defaultValue={t.nome}
                            onChange={(e) => {
                              const novas = [...configTurnos];
                              novas[idx].nome = e.target.value;
                              setConfigTurnos(novas);
                            }}
                            className="flex-1 p-1.5 bg-white border border-slate-300 rounded-lg text-xs font-medium"
                            placeholder="Nome da empresa/turno"
                          />
                          <input
                            type="text"
                            maxLength={2}
                            defaultValue={t.略号}
                            onChange={(e) => {
                              const novas = [...configTurnos];
                              novas[idx].略号 = e.target.value;
                              setConfigTurnos(novas);
                            }}
                            className="w-12 p-1.5 bg-white border border-slate-300 rounded-lg text-xs font-bold text-center"
                            placeholder="Abrev"
                          />
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Seção カラー設定 (Pré-visualização das cores) */}
                  <div className="pt-2 border-t border-slate-100">
                    <span className="text-[11px] font-bold bg-amber-100 text-amber-900 px-2 py-0.5 rounded-md inline-block mb-2">
                      カラー設定 (Amostra de Cores)
                    </span>
                    <div className="flex flex-wrap gap-1.5">
                      {configTurnos.map((t, idx) => (
                        <div
                          key={t.id}
                          className="px-2.5 py-1.5 rounded-lg font-bold text-xs shadow-2xs border"
                          style={{ backgroundColor: t.bg, color: t.text }}
                        >
                          {t.略号}
                        </div>
                      ))}
                    </div>
                  </div>

                  <button
                    type="button"
                    onClick={() => {
                      localStorage.setItem('fc26_config_turnos', JSON.stringify(configTurnos));
                      setIsModalConfigTurnosOpen(false);
                      showToast('✓ Configurações de turnos salvas com sucesso!');
                    }}
                    className="w-full py-3 bg-[#0F2C59] text-white font-bold rounded-xl text-xs shadow-md mt-2"
                  >
                    ✓ Salvar Configurações
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* MODAL DE CRIAÇÃO DE NOVA RESERVA */}
          {isModalNovaReservaOpen && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-xs flex items-center justify-center p-4 animate-in fade-in">
              <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                  <h3 className="font-serif font-bold text-slate-900 text-base">Nova Caixinha de Reserva</h3>
                  <button onClick={() => setIsModalNovaReservaOpen(false)} className="text-slate-400 font-bold text-lg p-1">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  handleAdicionarNovaReserva(form.nome.value, form.icone.value, form.saldo.value);
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-500 mb-1 uppercase text-[10px]">Nome da Reserva</label>
                    <input name="nome" type="text" placeholder="Ex: Passagem Brasil, IPVA Carro" required className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl outline-none focus:border-[#0F2C59]" />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-500 mb-1 uppercase text-[10px]">Ícone</label>
                      <select name="icone" className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl outline-none font-medium">
                        <option value="🚗">🚗 Carro / Shaken</option>
                        <option value="🏠">🏠 Imóvel / Aluguel</option>
                        <option value="🛡️">🛡️ Emergência</option>
                        <option value="✈️">✈️ Viagem</option>
                        <option value="🏥">🏥 Saúde</option>
                        <option value="🎒">🎒 Filhos / Escola</option>
                        <option value="💎">💎 Investimento</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-500 mb-1 uppercase text-[10px]">Saldo Inicial (¥)</label>
                      <input name="saldo" type="number" placeholder="0" defaultValue="0" className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl outline-none focus:border-[#0F2C59]" />
                    </div>
                  </div>

                  <button type="submit" className="w-full py-3 bg-[#0F2C59] text-white font-bold rounded-xl text-xs shadow-md mt-2">
                    Criar Caixinha de Reserva
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Bottom Sheet Modal (Criar / Editar / Excluir) */}
          {isModalOpen && (
            <OneTapModal
              onClose={() => { setIsModalOpen(false); setEditingTransaction(null); }}
              onSave={handleSave}
              onDelete={handleDelete}
              initialData={editingTransaction}
            />
          )}

          {/* Barra de Navegação Inferior */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#FDFBF7]/95 border-t border-slate-200/80 px-6 pt-2 pb-[max(0.75rem,env(safe-area-inset-bottom))] flex justify-around items-center z-20 backdrop-blur-md">
            <button
              type="button"
              onClick={() => setCurrentTab('dashboard')}
              className={`flex flex-col items-center gap-0.5 text-[11px] font-medium transition ${currentTab === 'dashboard' ? 'text-[#0F2C59] font-bold' : 'text-slate-400'}`}
            >
              <span className="text-base">📊</span>
              <span>Dashboard</span>
            </button>
            <button
              type="button"
              onClick={() => setCurrentTab('lancamentos')}
              className={`flex flex-col items-center gap-0.5 text-[11px] font-medium transition ${currentTab === 'lancamentos' ? 'text-[#0F2C59] font-bold' : 'text-slate-400'}`}
            >
              <span className="text-base">📝</span>
              <span>Lançamentos</span>
            </button>
            <button
              type="button"
              onClick={() => setCurrentTab('config')}
              className={`flex flex-col items-center gap-0.5 text-[11px] font-medium transition ${currentTab === 'config' ? 'text-[#0F2C59] font-bold' : 'text-slate-400'}`}
            >
              <span className="text-base">⚙️</span>
              <span>Conexão</span>
            </button>
          </nav>

        </div>
      );
    }

    /**
     * Modal Otimizado para Mobile
     */
    function OneTapModal({ onClose, onSave, onDelete, initialData }) {
      const isEditing = !!(initialData && initialData.id);
      const [tipo, setTipo] = useState(initialData?.tipo || 'Despesa');
      const [valor, setValor] = useState(initialData?.valor ? String(initialData.valor) : '');
      const [categoria, setCategoria] = useState(initialData?.categoria || 'Supermercado & Feira');
      const [estabelecimento, setEstabelecimento] = useState(initialData?.estabelecimento || '');
      const [data, setData] = useState(initialData?.data || new Date().toISOString().split('T')[0]);

      const categorias = tipo === 'Despesa' ? CATEGORIAS_DESPESA : CATEGORIAS_RECEITA;

      const submit = (e) => {
        if (e) e.preventDefault();
        const num = parseFloat(valor);
        if (!num || num <= 0) {
          alert('Por favor, informe um valor numérico válido.');
          return;
        }
        onSave({
          data,
          tipo,
          categoria,
          valor: num,
          estabelecimento: estabelecimento.trim() || 'TRIAL スーパー'
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end justify-center animate-in fade-in duration-200">
          
          <div className="bg-[#FDFBF7] w-full max-w-md rounded-t-[28px] shadow-2xl flex flex-col max-h-[90vh] max-h-[90dvh] border-t border-slate-200">
            
            {/* Header Fixo */}
            <div className="px-5 py-3.5 border-b border-slate-200 flex justify-between items-center shrink-0">
              <div className="flex items-center gap-2">
                <span className={`w-2 h-2 rounded-full ${isEditing ? 'bg-amber-500' : 'bg-[#0F2C59]'}`}></span>
                <h3 className="font-serif font-bold text-slate-900 text-lg">
                  {isEditing ? 'Editar Lançamento' : 'Novo Lançamento'}
                </h3>
              </div>
              <button 
                type="button"
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 text-sm font-bold active:scale-95"
              >
                ✕
              </button>
            </div>

            {/* Conteúdo com Rolagem */}
            <form onSubmit={submit} className="flex-1 overflow-y-auto px-5 py-3.5 space-y-4">
              
              {/* Segmentação: Despesa / Receita / Reserva */}
              <div className="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-2xl text-xs font-bold">
                <button
                  type="button"
                  onClick={() => { setTipo('Despesa'); setCategoria(CATEGORIAS_DESPESA[0].id); }}
                  className={`py-2 rounded-xl transition ${
                    tipo === 'Despesa' ? 'bg-white text-rose-600 shadow-xs' : 'text-slate-500'
                  }`}
                >
                  ↓ Despesa
                </button>
                <button
                  type="button"
                  onClick={() => { setTipo('Receita'); setCategoria(CATEGORIAS_RECEITA[0].id); }}
                  className={`py-2 rounded-xl transition ${
                    tipo === 'Receita' ? 'bg-white text-emerald-600 shadow-xs' : 'text-slate-500'
                  }`}
                >
                  ↑ Receita
                </button>
                <button
                  type="button"
                  onClick={() => { setTipo('Aporte Reserva'); setCategoria('Reserva: Shaken (Inspeção Veicular)'); }}
                  className={`py-2 rounded-xl transition ${
                    tipo.includes('Reserva') ? 'bg-[#0F2C59] text-white shadow-xs' : 'text-slate-500'
                  }`}
                >
                  🏦 Reserva
                </button>
              </div>

              {/* Sub-opções de Reserva (Depositar vs. Retirar) */}
              {tipo.includes('Reserva') && (
                <div className="grid grid-cols-2 gap-2 bg-amber-50 p-1.5 rounded-xl border border-amber-200 text-xs font-bold">
                  <button
                    type="button"
                    onClick={() => setTipo('Aporte Reserva')}
                    className={`py-1.5 rounded-lg transition ${
                      tipo === 'Aporte Reserva' ? 'bg-emerald-600 text-white shadow-2xs' : 'text-slate-600'
                    }`}
                  >
                    + Depositar (Guardar)
                  </button>
                  <button
                    type="button"
                    onClick={() => setTipo('Retirada Reserva')}
                    className={`py-1.5 rounded-lg transition ${
                      tipo === 'Retirada Reserva' ? 'bg-amber-600 text-white shadow-2xs' : 'text-slate-600'
                    }`}
                  >
                    - Retirar (Usar)
                  </button>
                </div>
              )}

              {/* Campo de Valor com Teclado Numérico */}
              <div>
                <label className="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">
                  Valor (¥)
                </label>
                <div className="relative">
                  <span className="absolute left-4 top-1/2 -translate-y-1/2 text-2xl font-bold text-slate-400">¥</span>
                  <input
                    type="text"
                    inputMode="numeric"
                    pattern="[0-9]*"
                    autoFocus
                    placeholder="0"
                    value={valor}
                    onChange={(e) => setValor(e.target.value.replace(/[^0-9]/g, ''))}
                    className="w-full pl-11 pr-4 py-2.5 bg-white border border-slate-300 focus:border-[#0F2C59] rounded-2xl text-2xl font-extrabold text-[#0F2C59] outline-none"
                  />
                </div>
              </div>

              {/* Categorias em Grid 2 Colunas ou Caixinhas de Reserva */}
              <div>
                <label className="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">
                  {tipo.includes('Reserva') ? 'Escolha qual Caixinha de Reserva:' : 'Categoria (Selecione em 1 toque):'}
                </label>
                <div className="grid grid-cols-2 gap-1.5 max-h-44 overflow-y-auto pr-1">
                  {tipo.includes('Reserva') ? (
                    // Exibe as Caixinhas de Reserva Cadastradas
                    [
                      { id: 'Reserva: Shaken (Inspeção Veicular)', label: 'Shaken (Carro)', icon: '🚗' },
                      { id: 'Reserva: Renovação Contrato Aluguel', label: 'Renovação Aluguel', icon: '🏠' },
                      { id: 'Reserva: Reserva de Emergência', label: 'Reserva Emergência', icon: '🛡️' },
                    ].map((r) => {
                      const isSelected = categoria === r.id;
                      return (
                        <button
                          key={r.id}
                          type="button"
                          onClick={() => { setCategoria(r.id); setEstabelecimento(r.label); }}
                          className={`flex items-center gap-1.5 p-2 rounded-xl text-xs font-medium text-left transition active:scale-95 border ${
                            isSelected
                              ? 'bg-[#0F2C59] text-white border-[#0F2C59] font-bold shadow-xs'
                              : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                          }`}
                        >
                          <span className="text-sm shrink-0">{r.icon}</span>
                          <span className="truncate">{r.label}</span>
                        </button>
                      );
                    })
                  ) : (
                    categorias.map((c) => {
                      const isSelected = categoria === c.id;
                      return (
                        <button
                          key={c.id}
                          type="button"
                          onClick={() => setCategoria(c.id)}
                          className={`flex items-center gap-1.5 p-2 rounded-xl text-xs font-medium text-left transition active:scale-95 border ${
                            isSelected
                              ? 'bg-[#0F2C59] text-white border-[#0F2C59] font-bold shadow-xs'
                              : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                          }`}
                        >
                          <span className="text-sm shrink-0">{c.icon}</span>
                          <span className="truncate">{c.label}</span>
                        </button>
                      );
                    })
                  )}
                </div>
              </div>

              {/* Estabelecimento com sugestão padronizada */}
              <div>
                <label className="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">
                  Nome do Estabelecimento (Loja / Mercado)
                </label>
                <input
                  type="text"
                  placeholder="Ex: TRIAL スーパー, Lawson, あんり"
                  value={estabelecimento}
                  onChange={(e) => setEstabelecimento(e.target.value)}
                  className="w-full px-3 py-2 bg-white border border-slate-300 focus:border-[#0F2C59] rounded-xl text-sm font-medium text-slate-800 outline-none"
                />
              </div>

              {/* Data */}
              <div>
                <label className="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">
                  Data
                </label>
                <input
                  type="date"
                  value={data}
                  onChange={(e) => setData(e.target.value)}
                  className="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm font-medium text-slate-800 outline-none"
                />
              </div>

            </form>

            {/* Rodapé Fixo com Botão de Salvar e Excluir */}
            <div className="p-4 pt-2.5 bg-[#FDFBF7] border-t border-slate-200 shrink-0 pb-[max(1rem,env(safe-area-inset-bottom))] space-y-2">
              <button
                type="button"
                onClick={submit}
                disabled={!valor}
                className="w-full py-3.5 bg-[#0F2C59] hover:bg-[#1B3B6F] disabled:opacity-50 active:scale-[0.98] text-white font-bold rounded-2xl shadow-lg flex items-center justify-center gap-2 text-sm transition"
              >
                <span>✓</span>
                <span>{isEditing ? 'Salvar Alterações' : 'Salvar Lançamento'}</span>
              </button>

              {isEditing && (
                <button
                  type="button"
                  onClick={() => onDelete(initialData.id)}
                  className="w-full py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-xl text-xs transition"
                >
                  🗑 Excluir este Lançamento
                </button>
              )}
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
