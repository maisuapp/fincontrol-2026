<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Controle 2026 - FinControl Mobile</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#F5F2EB',
            petrol: {
              700: '#1B3B6F',
              800: '#0F2C59',
              900: '#081B38',
            },
            coral: {
              50: '#FFF1F2',
              600: '#E11D48',
            },
            emerald: {
              50: '#ECFDF5',
              600: '#059669',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Playfair Display', 'Merriweather', 'serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM & Babel for standalone browser execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #F5F2EB;
    }
    input, select, textarea {
      user-select: auto;
    }
  </style>
</head>
<body class="bg-[#F5F2EB]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SPREADSHEET_ID = '1_MJg31Kr1gWBXSV9UbCACH5O7Tx0CArNU245daaqwh8';
    const SHEET_NAME = 'Lançamentos_2026';

    const CATEGORIAS_DESPESA = [
      { id: 'Supermercado & Feira', label: 'Supermercado & Feira', icon: '🛒' },
      { id: 'Alimentação Fora & Lanches', label: 'Restaurante & Lanches', icon: '🍱' },
      { id: 'Moradia (Aluguel)', label: 'Moradia (Aluguel)', icon: '🏠' },
      { id: 'Contas Fixas & Utilidades', label: 'Luz, Gás & Água', icon: '💡' },
      { id: 'Serviços Financeiros & Impostos', label: 'Impostos & Finanças', icon: '🏛️' },
      { id: 'Saúde & Farmácia', label: 'Saúde & Farmácia', icon: '💊' },
      { id: 'Educação & Filhos', label: 'Educação & Filhos', icon: '🎒' },
      { id: 'Transporte & Carro', label: 'Gasolina & Carro', icon: '🚗' },
      { id: 'Lazer, Compras & Variados', label: 'Lazer & Compras', icon: '🛍️' },
      { id: 'Pessoal, Roupas & Cuidados', label: 'Pessoal & Roupas', icon: '✂️' },
      { id: 'Doações & Remessas', label: 'Doações / Remessas', icon: '🤝' },
      { id: 'Reservas & Investimentos', label: 'Investimentos', icon: '📈' },
    ];

    const CATEGORIAS_RECEITA = [
      { id: 'Salário Principal', label: 'Salário Principal', icon: '💼' },
      { id: 'Salário Cônjuge', label: 'Salário Cônjuge', icon: '💼' },
      { id: 'Auxílio Governamental', label: 'Auxílio / Benefício', icon: '👶' },
      { id: 'Renda Extra & Outros', label: 'Renda Extra', icon: '✨' },
    ];

    // Dados base iniciais sincronizados
    const DADOS_INICIAIS = [
      { id: '1', data: '2026-09-04', tipo: 'Despesa', categoria: 'Saúde & Farmácia', valor: 750, estabelecimento: '島根大学医学部附属病院' },
      { id: '2', data: '2026-09-04', tipo: 'Despesa', categoria: 'Supermercado & Feira', valor: 9026, estabelecimento: 'トライアル スーパー' },
      { id: '3', data: '2026-09-04', tipo: 'Despesa', categoria: 'Supermercado & Feira', valor: 4949, estabelecimento: 'あんり' },
      { id: '4', data: '2026-09-03', tipo: 'Despesa', categoria: 'Supermercado & Feira', valor: 4838, estabelecimento: 'Supermercado' },
      { id: '5', data: '2026-09-02', tipo: 'Despesa', categoria: 'Supermercado & Feira', valor: 4051, estabelecimento: 'Supermercado' },
    ];

    function App() {
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [transactions, setTransactions] = useState(() => {
        const local = localStorage.getItem('fc26_transactions');
        return local ? JSON.parse(local) : DADOS_INICIAIS;
      });
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [receiptDraft, setReceiptDraft] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [googleClientId, setGoogleClientId] = useState(localStorage.getItem('fc26_google_client_id') || '');
      const [geminiApiKey, setGeminiApiKey] = useState(localStorage.getItem('fc26_gemini_api_key') || '');
      const [isAuthed, setIsAuthed] = useState(!!localStorage.getItem('gdrive_access_token'));
      const [isScanning, setIsScanning] = useState(false);
      const fileInputRef = useRef(null);

      const showToast = (msg, isError = false) => {
        setToastMessage({ msg, isError });
        setTimeout(() => setToastMessage(null), 3500);
      };

      const handleSave = async (newTx) => {
        const updated = [newTx, ...transactions];
        setTransactions(updated);
        localStorage.setItem('fc26_transactions', JSON.stringify(updated));

        const token = localStorage.getItem('gdrive_access_token');
        if (token) {
          try {
            const range = `${SHEET_NAME}!A2:G`;
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`;
            await fetch(url, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                values: [[newTx.data, '', newTx.tipo, newTx.categoria, newTx.valor, newTx.estabelecimento, newTx.observacoes || '']]
              })
            });
            showToast('Lançamento salvo na Planilha Google com sucesso!');
          } catch (e) {
            showToast('Salvo no dispositivo (Erro ao conectar ao Sheets).', true);
          }
        } else {
          showToast('Lançamento salvo localmente no aparelho.');
        }
      };

      const handleCapture = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        setIsScanning(true);
        try {
          if (!geminiApiKey) {
            setReceiptDraft({
              tipo: 'Despesa',
              valor: '',
              estabelecimento: 'Comprovante Fotografado',
              data: new Date().toISOString().split('T')[0],
              categoria: 'Supermercado & Feira'
            });
            setIsModalOpen(true);
            return;
          }

          // Leitura OCR via Gemini Multimodal
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = async () => {
            const base64Data = reader.result.split(',')[1];
            const prompt = `Analise este recibo fiscal japonês/brasileiro e extraia um JSON estrito: {"estabelecimento":"Nome da loja","valor":1234,"data":"YYYY-MM-DD","categoria":"Supermercado & Feira"}`;
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: file.type || 'image/jpeg', data: base64Data } }] }],
                generationConfig: { temperature: 0.1, response_mime_type: 'application/json' }
              })
            });
            const d = await res.json();
            const parsed = JSON.parse(d.candidates[0].content.parts[0].text);
            setReceiptDraft({ ...parsed, tipo: 'Despesa' });
            setIsModalOpen(true);
          };
        } catch (err) {
          showToast('Erro ao ler recibo: ' + err.message, true);
          setReceiptDraft({ tipo: 'Despesa', data: new Date().toISOString().split('T')[0] });
          setIsModalOpen(true);
        } finally {
          setIsScanning(false);
          e.target.value = '';
        }
      };

      // Cálculos do Dashboard
      const receitasTotais = 3984901; // Base anual importada
      const despesasTotais = 4186382 + transactions.filter(t => !['1','2','3','4','5'].includes(t.id) && t.tipo === 'Despesa').reduce((acc, t) => acc + (t.valor || 0), 0);
      const saldo = receitasTotais - despesasTotais;

      return (
        <div className="min-h-screen max-w-md mx-auto flex flex-col justify-between relative pb-20">
          
          {/* Toast */}
          {toastMessage && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-3 bg-[#081B38] text-white text-xs font-semibold rounded-2xl shadow-2xl border border-slate-700 flex items-center gap-2">
              <span className={toastMessage.isError ? "text-rose-400" : "text-emerald-400"}>●</span>
              {toastMessage.msg}
            </div>
          )}

          {/* Header */}
          <header className="px-5 py-4 flex justify-between items-center border-b border-slate-200/80 bg-[#F5F2EB]/90 sticky top-0 z-20 backdrop-blur-md">
            <div>
              <span className="text-[10px] tracking-widest uppercase font-bold text-[#0F2C59]">Controle 2026</span>
              <h1 className="text-xl font-serif font-bold text-slate-900">FinControl</h1>
            </div>
            <span className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800">
              ● Ativo
            </span>
          </header>

          {/* Conteúdo */}
          <main className="p-5 flex-1 overflow-y-auto">
            {currentTab === 'dashboard' && (
              <div className="space-y-5">
                {/* Card de Liquidez */}
                <div className="bg-[#0F2C59] text-white rounded-3xl p-6 shadow-xl relative">
                  <div className="flex justify-between items-start mb-2">
                    <span className="text-[10px] uppercase tracking-widest text-blue-200 font-bold">Saldo Líquido Acumulado</span>
                    <span className="px-2 py-0.5 bg-rose-600 text-white text-[9px] font-bold rounded-full uppercase">Atenção</span>
                  </div>
                  <h2 className="text-4xl font-extrabold tracking-tight text-rose-200 mb-4">
                    -¥ {Math.abs(saldo).toLocaleString('ja-JP')}
                  </h2>
                  <div className="grid grid-cols-2 gap-3 pt-3 border-t border-blue-900/80 text-xs">
                    <div>
                      <span className="text-[10px] text-blue-300 uppercase">Receitas</span>
                      <p className="font-bold text-emerald-400">¥ {receitasTotais.toLocaleString('ja-JP')}</p>
                    </div>
                    <div>
                      <span className="text-[10px] text-blue-300 uppercase">Despesas</span>
                      <p className="font-bold text-rose-300">¥ {despesasTotais.toLocaleString('ja-JP')}</p>
                    </div>
                  </div>
                </div>

                {/* Ponto de Atenção */}
                <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs flex items-center gap-3">
                  <span className="text-2xl">⚡</span>
                  <div>
                    <h3 className="text-xs font-bold text-slate-800 uppercase tracking-wider">Setembro em Andamento</h3>
                    <p className="text-xs text-slate-500 mt-0.5">8 movimentos registrados na base central (¥ 32.165)</p>
                  </div>
                </div>

                {/* Maiores Categorias */}
                <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
                  <h3 className="text-sm font-serif font-bold text-slate-800 mb-3">Maiores Categorias (2026)</h3>
                  <div className="space-y-3 text-xs font-medium">
                    <div>
                      <div className="flex justify-between mb-1">
                        <span>1. Supermercado & Feira</span>
                        <span className="font-bold">¥ 1.582.806</span>
                      </div>
                      <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div className="bg-[#0F2C59] h-full w-[38%] rounded-full"></div>
                      </div>
                    </div>
                    <div>
                      <div className="flex justify-between mb-1">
                        <span>2. Serviços Financeiros & Impostos</span>
                        <span className="font-bold">¥ 807.919</span>
                      </div>
                      <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div className="bg-slate-400 h-full w-[20%] rounded-full"></div>
                      </div>
                    </div>
                    <div>
                      <div className="flex justify-between mb-1">
                        <span>3. Moradia (Aluguel)</span>
                        <span className="font-bold">¥ 509.899</span>
                      </div>
                      <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div className="bg-slate-400 h-full w-[12%] rounded-full"></div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Botão de Lançamento Direto */}
                <button
                  onClick={() => { setReceiptDraft(null); setIsModalOpen(true); }}
                  className="w-full py-4 bg-[#0F2C59] text-white font-bold rounded-2xl shadow-lg active:scale-98 transition flex items-center justify-center gap-2 text-sm"
                >
                  + Registrar Despesa / Receita
                </button>
              </div>
            )}

            {currentTab === 'lancamentos' && (
              <div className="space-y-3">
                <h2 className="text-lg font-serif font-bold text-slate-800 mb-2">Últimos Lançamentos</h2>
                {transactions.map((t, idx) => (
                  <div key={idx} className="bg-white p-3.5 rounded-2xl border border-slate-200 flex justify-between items-center text-xs">
                    <div>
                      <h4 className="font-bold text-slate-800 text-sm">{t.estabelecimento || t.categoria}</h4>
                      <p className="text-slate-400">{t.data} • {t.categoria}</p>
                    </div>
                    <span className={`font-bold text-sm ${t.tipo === 'Despesa' ? 'text-slate-900' : 'text-emerald-600'}`}>
                      {t.tipo === 'Despesa' ? '-' : '+'}¥ {Math.round(t.valor).toLocaleString('ja-JP')}
                    </span>
                  </div>
                ))}
              </div>
            )}

            {currentTab === 'config' && (
              <div className="bg-white p-5 rounded-2xl border border-slate-200 space-y-4 text-xs">
                <h2 className="text-base font-serif font-bold text-slate-800">Conexão Google & IA</h2>
                <div>
                  <label className="block font-bold text-slate-500 mb-1">ID da Planilha (Sheets)</label>
                  <input type="text" readOnly value={SPREADSHEET_ID} className="w-full p-2 bg-slate-100 rounded-lg text-slate-600 font-mono text-[11px]" />
                </div>
                <div>
                  <label className="block font-bold text-slate-500 mb-1">Chave Gemini API (OCR Recibos)</label>
                  <input
                    type="password"
                    placeholder="AIzaSy..."
                    value={geminiApiKey}
                    onChange={(e) => {
                      setGeminiApiKey(e.target.value);
                      localStorage.setItem('fc26_gemini_api_key', e.target.value);
                    }}
                    className="w-full p-2 border border-slate-300 rounded-lg outline-none focus:border-[#0F2C59]"
                  />
                  <p className="text-[10px] text-slate-400 mt-1">Insira para ativar a leitura automática de fotos de notas fiscais.</p>
                </div>
              </div>
            )}
          </main>

          {/* Botão Flutuante da Câmera (FAB) */}
          <input
            type="file"
            ref={fileInputRef}
            onChange={handleCapture}
            accept="image/*"
            capture="environment"
            className="hidden"
          />
          <button
            onClick={() => fileInputRef.current?.click()}
            disabled={isScanning}
            className="fixed bottom-20 right-5 z-40 w-14 h-14 bg-[#0F2C59] text-white rounded-full flex items-center justify-center shadow-2xl active:scale-90 transition border-2 border-white text-xl"
            title="Tirar foto do recibo"
          >
            {isScanning ? '⏳' : '📷'}
          </button>

          {/* Modal One-Tap */}
          {isModalOpen && (
            <OneTapModal
              onClose={() => setIsModalOpen(false)}
              onSave={handleSave}
              initialData={receiptDraft}
            />
          )}

          {/* Bottom Navigation */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#FDFBF7]/95 border-t border-slate-200 px-6 py-2.5 flex justify-around items-center z-30">
            <button
              onClick={() => setCurrentTab('dashboard')}
              className={`flex flex-col items-center gap-1 text-[11px] ${currentTab === 'dashboard' ? 'text-[#0F2C59] font-bold' : 'text-slate-400'}`}
            >
              <span>📊</span>
              <span>Dashboard</span>
            </button>
            <button
              onClick={() => setCurrentTab('lancamentos')}
              className={`flex flex-col items-center gap-1 text-[11px] ${currentTab === 'lancamentos' ? 'text-[#0F2C59] font-bold' : 'text-slate-400'}`}
            >
              <span>📝</span>
              <span>Lançamentos</span>
            </button>
            <button
              onClick={() => setCurrentTab('config')}
              className={`flex flex-col items-center gap-1 text-[11px] ${currentTab === 'config' ? 'text-[#0F2C59] font-bold' : 'text-slate-400'}`}
            >
              <span>⚙️</span>
              <span>Conexão</span>
            </button>
          </nav>

        </div>
      );
    }

    function OneTapModal({ onClose, onSave, initialData }) {
      const [tipo, setTipo] = useState(initialData?.tipo || 'Despesa');
      const [valor, setValor] = useState(initialData?.valor ? String(initialData.valor) : '');
      const [categoria, setCategoria] = useState(initialData?.categoria || 'Supermercado & Feira');
      const [estabelecimento, setEstabelecimento] = useState(initialData?.estabelecimento || '');
      const [data, setData] = useState(initialData?.data || new Date().toISOString().split('T')[0]);

      const categorias = tipo === 'Despesa' ? CATEGORIAS_DESPESA : CATEGORIAS_RECEITA;

      const submit = (e) => {
        e.preventDefault();
        const num = parseFloat(valor);
        if (!num || num <= 0) return alert('Insira um valor numérico válido.');
        onSave({ data, tipo, categoria, valor: num, estabelecimento: estabelecimento || categoria });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/50 flex items-end justify-center">
          <div className="bg-[#FDFBF7] w-full max-w-md rounded-t-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto border-t border-slate-200">
            <div className="flex justify-between items-center pb-2 border-b border-slate-200">
              <h3 className="font-serif font-bold text-slate-800 text-lg">Novo Lançamento</h3>
              <button onClick={onClose} className="text-slate-400 text-xl font-bold p-1">✕</button>
            </div>

            <form onSubmit={submit} className="space-y-4">
              {/* Segmentação */}
              <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl text-xs font-semibold">
                <button
                  type="button"
                  onClick={() => setTipo('Despesa')}
                  className={`py-2 rounded-lg transition ${tipo === 'Despesa' ? 'bg-white text-rose-600 shadow-xs' : 'text-slate-500'}`}
                >
                  ↓ Despesa
                </button>
                <button
                  type="button"
                  onClick={() => setTipo('Receita')}
                  className={`py-2 rounded-lg transition ${tipo === 'Receita' ? 'bg-white text-emerald-600 shadow-xs' : 'text-slate-500'}`}
                >
                  ↑ Receita
                </button>
              </div>

              {/* Valor com Teclado Numérico */}
              <div>
                <label className="block text-[10px] uppercase font-bold text-slate-400 mb-1">Valor (¥)</label>
                <div className="relative">
                  <span className="absolute left-4 top-1/2 -translate-y-1/2 text-2xl font-bold text-slate-400">¥</span>
                  <input
                    type="text"
                    inputMode="numeric"
                    pattern="[0-9]*"
                    autoFocus
                    placeholder="0"
                    value={valor}
                    onChange={(e) => setValor(e.target.value.replace(/[^0-9]/g, ''))}
                    className="w-full pl-11 pr-4 py-3 bg-white border border-slate-300 rounded-2xl text-3xl font-bold text-[#0F2C59] outline-none focus:border-[#0F2C59]"
                  />
                </div>
              </div>

              {/* Chips de Categoria */}
              <div>
                <label className="block text-[10px] uppercase font-bold text-slate-400 mb-1">Categoria (Toque para escolher)</label>
                <div className="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto p-1 bg-white rounded-xl border border-slate-200">
                  {categorias.map((c) => (
                    <button
                      key={c.id}
                      type="button"
                      onClick={() => setCategoria(c.id)}
                      className={`px-2.5 py-1.5 rounded-lg text-xs font-medium transition active:scale-95 ${categoria === c.id ? 'bg-[#0F2C59] text-white font-bold' : 'bg-slate-100 text-slate-700'}`}
                    >
                      {c.icon} {c.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Loja / Descrição */}
              <div>
                <label className="block text-[10px] uppercase font-bold text-slate-400 mb-1">Estabelecimento</label>
                <input
                  type="text"
                  placeholder="Ex: Trial, Lawson, Supermercado"
                  value={estabelecimento}
                  onChange={(e) => setEstabelecimento(e.target.value)}
                  className="w-full p-2.5 bg-white border border-slate-300 rounded-xl text-xs outline-none"
                />
              </div>

              {/* Data */}
              <div>
                <label className="block text-[10px] uppercase font-bold text-slate-400 mb-1">Data</label>
                <input
                  type="date"
                  value={data}
                  onChange={(e) => setData(e.target.value)}
                  className="w-full p-2 bg-white border border-slate-300 rounded-xl text-xs outline-none"
                />
              </div>

              <button
                type="submit"
                className="w-full py-3.5 bg-[#0F2C59] text-white font-bold rounded-2xl shadow-lg text-sm active:scale-98 transition"
              >
                ✓ Salvar Lançamento
              </button>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
